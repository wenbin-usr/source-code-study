<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="storage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="svc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7cf5"/>
      <stop offset="1" stop-color="#3b5fe0"/>
    </linearGradient>
    <linearGradient id="svc2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5cf0"/>
      <stop offset="1" stop-color="#6a46dd"/>
    </linearGradient>
    <linearGradient id="queue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf5c"/>
      <stop offset="1" stop-color="#f5b53a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1180" height="720" fill="url(#bg)"/>

  <!-- Title -->
  <text x="590" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1e293b">RocketMQ 5.x 延迟消息（时间轮）处理流程</text>
  <text x="590" y="72" text-anchor="middle" font-size="14" fill="#64748b">TimerMessageStore 六线程 + 三队列流水线</text>

  <!-- Stage labels -->
  <text x="590" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#3b5fe0" letter-spacing="2">STAGE 1 · 入队 ENQUEUE（写入定时结构）</text>
  <text x="590" y="432" text-anchor="middle" font-size="15" font-weight="700" fill="#6a46dd" letter-spacing="2">STAGE 2 · 出队 DEQUEUE（到期投递）</text>

  <!-- divider -->
  <line x1="60" y1="410" x2="1120" y2="410" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- ================= ENQUEUE ROW ================= -->
  <!-- Producer -->
  <g filter="url(#shadow)">
    <rect x="60" y="150" rx="10" width="130" height="58" fill="#0f172a"/>
    <text x="125" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Producer</text>
    <text x="125" y="195" text-anchor="middle" font-size="11" fill="#94a3b8">发送延迟消息</text>
  </g>

  <!-- CommitLog -->
  <g filter="url(#shadow)">
    <rect x="235" y="140" rx="10" width="150" height="78" fill="url(#storage)" stroke="#64748b" stroke-width="1.5"/>
    <text x="310" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">CommitLog</text>
    <text x="310" y="188" text-anchor="middle" font-size="11" fill="#64748b">消息先落盘</text>
    <text x="310" y="204" text-anchor="middle" font-size="11" fill="#64748b">（改写 topic → TIMER_TOPIC）</text>
  </g>

  <!-- ConsumeQueue of timer topic -->
  <g filter="url(#shadow)">
    <rect x="430" y="140" rx="10" width="175" height="78" fill="url(#storage)" stroke="#64748b" stroke-width="1.5"/>
    <text x="517" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">ConsumeQueue</text>
    <text x="517" y="182" text-anchor="middle" font-size="12" fill="#0ea5e9" font-family="Consolas, monospace">rmq_sys_wheel_timer</text>
    <text x="517" y="202" text-anchor="middle" font-size="11" fill="#64748b">queueId = 0</text>
  </g>

  <!-- TimerEnqueueGetService -->
  <g filter="url(#shadow)">
    <rect x="655" y="140" rx="10" width="185" height="78" fill="url(#svc)"/>
    <text x="747" y="175" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">TimerEnqueueGetService</text>
    <text x="747" y="200" text-anchor="middle" font-size="11" fill="#dbe4ff">扫描 ConsumeQueue</text>
  </g>

  <!-- enqueuePutQueue -->
  <g filter="url(#shadow)">
    <rect x="895" y="152" rx="8" width="185" height="54" fill="url(#queue)"/>
    <text x="987" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#7c4a03" font-family="Consolas, monospace">enqueuePutQueue</text>
    <text x="987" y="192" text-anchor="middle" font-size="11" fill="#92620e" font-family="Consolas, monospace">&lt;TimerRequest&gt;</text>
  </g>

  <!-- TimerEnqueuePutService (row 2) -->
  <g filter="url(#shadow)">
    <rect x="895" y="270" rx="10" width="185" height="78" fill="url(#svc)"/>
    <text x="987" y="305" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">TimerEnqueuePutService</text>
    <text x="987" y="330" text-anchor="middle" font-size="11" fill="#dbe4ff">计算到期时间戳</text>
  </g>

  <!-- TimerWheel + TimerLog -->
  <g filter="url(#shadow)">
    <rect x="560" y="270" rx="10" width="170" height="78" fill="url(#storage)" stroke="#b45309" stroke-width="1.8"/>
    <text x="645" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">TimerWheel 时间轮</text>
    <text x="645" y="315" text-anchor="middle" font-size="11" fill="#64748b">到期槽位 → 记录索引链表</text>
    <text x="645" y="333" text-anchor="middle" font-size="11" fill="#64748b">Slot = delayTime</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="200" y="270" rx="10" width="170" height="78" fill="url(#storage)" stroke="#b45309" stroke-width="1.8"/>
    <text x="285" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">TimerLog</text>
    <text x="285" y="315" text-anchor="middle" font-size="11" fill="#64748b">定时消息索引</text>
    <text x="285" y="333" text-anchor="middle" font-size="11" fill="#64748b">size + py + cqOffset…</text>
  </g>

  <!-- enqueue arrows -->
  <line x1="190" y1="179" x2="232" y2="179" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="385" y1="179" x2="427" y2="179" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="605" y1="179" x2="652" y2="179" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="179" x2="892" y2="179" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- down to put service -->
  <line x1="987" y1="206" x2="987" y2="267" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- put service -> timer wheel / timer log -->
  <path d="M 893 309 L 734 309" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 558 315 L 374 315" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowBack)"/>
  <text x="475" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">Slot 槽位通过 firstPos / lastPos</text>
  <text x="480" y="306" text-anchor="middle" font-size="10.5" fill="#64748b">指向 TimerLog 记录链</text>

  <!-- ================= DEQUEUE ROW ================= -->
  <!-- TimerDequeueGetService -->
  <g filter="url(#shadow)">
    <rect x="60" y="490" rx="10" width="185" height="78" fill="url(#svc2)"/>
    <text x="152" y="515" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">TimerDequeueGetService</text>
    <text x="152" y="540" text-anchor="middle" font-size="11" fill="#ece7fd">推进时间轮，扫描到期槽位</text>
  </g>

  <!-- dequeueGetQueue -->
  <g filter="url(#shadow)">
    <rect x="300" y="502" rx="8" width="180" height="54" fill="url(#queue)"/>
    <text x="390" y="522" text-anchor="middle" font-size="13" font-weight="700" fill="#7c4a03" font-family="Consolas, monospace">dequeueGetQueue</text>
    <text x="390" y="542" text-anchor="middle" font-size="10.5" fill="#92620e" font-family="Consolas, monospace">&lt;List&lt;TimerRequest&gt;&gt;</text>
  </g>

  <!-- TimerDequeueGetMessageService -->
  <g filter="url(#shadow)">
    <rect x="535" y="490" rx="10" width="200" height="78" fill="url(#svc2)"/>
    <text x="635" y="515" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">TimerDequeueGetMessageService</text>
    <text x="635" y="540" text-anchor="middle" font-size="11" fill="#ece7fd">按 phyOffset 回查 CommitLog</text>
  </g>

  <!-- dequeuePutQueue -->
  <g filter="url(#shadow)">
    <rect x="900" y="502" rx="8" width="180" height="54" fill="url(#queue)"/>
    <text x="990" y="522" text-anchor="middle" font-size="13" font-weight="700" fill="#7c4a03" font-family="Consolas, monospace">dequeuePutQueue</text>
    <text x="990" y="542" text-anchor="middle" font-size="11" fill="#92620e" font-family="Consolas, monospace">&lt;TimerRequest&gt;</text>
  </g>

  <!-- TimerDequeuePutMessageService -->
  <g filter="url(#shadow)">
    <rect x="890" y="600" rx="10" width="200" height="78" fill="url(#svc2)"/>
    <text x="990" y="625" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff">TimerDequeuePutMessageService</text>
    <text x="990" y="650" text-anchor="middle" font-size="11" fill="#ece7fd">恢复真实 topic，重新投递</text>
  </g>

  <!-- Real topic + consumer -->
  <g filter="url(#shadow)">
    <rect x="560" y="600" rx="10" width="170" height="78" fill="url(#storage)" stroke="#64748b" stroke-width="1.5"/>
    <text x="645" y="628" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">真实 Topic</text>
    <text x="645" y="647" text-anchor="middle" font-size="11" fill="#64748b">ConsumeQueue</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="300" y="600" rx="10" width="130" height="78" fill="#0f172a"/>
    <text x="365" y="628" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Consumer</text>
    <text x="365" y="648" text-anchor="middle" font-size="11" fill="#94a3b8">消费到期消息</text>
  </g>

  <!-- dequeue arrows -->
  <!-- wheel -> dequeueGet -->
  <path d="M 645 348 L 645 380 L 152 380 L 152 487" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="85" y="392" text-anchor="middle" font-size="10.5" fill="#64748b">到期（currReadTime 推进）</text>
  <line x1="245" y1="529" x2="297" y2="529" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="529" x2="532" y2="529" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- get msg -> commitlog (dashed back reference) -->
  <path d="M 635 487 L 635 460 L 285 460 L 285 352" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowBack)"/>
  <text x="330" y="432" text-anchor="middle" font-size="10.5" fill="#64748b">回查 CommitLog</text>
  <line x1="735" y1="529" x2="897" y2="529" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- putQueue -> put service -->
  <line x1="990" y1="556" x2="990" y2="597" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- put service -> real topic -->
  <line x1="887" y1="639" x2="733" y2="639" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="557" y1="639" x2="433" y2="639" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- legend -->
  <g>
    <rect x="60" y="676" rx="8" width="620" height="34" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="76" y="687" width="16" height="12" rx="3" fill="url(#svc)"/>
    <text x="100" y="697" font-size="11" fill="#475569">线程（Enqueue）</text>
    <rect x="200" y="687" width="16" height="12" rx="3" fill="url(#svc2)"/>
    <text x="224" y="697" font-size="11" fill="#475569">线程（Dequeue）</text>
    <rect x="324" y="687" width="16" height="12" rx="3" fill="url(#queue)"/>
    <text x="348" y="697" font-size="11" fill="#475569">内部阻塞队列</text>
    <rect x="448" y="687" width="16" height="12" rx="3" fill="url(#storage)" stroke="#64748b"/>
    <text x="472" y="697" font-size="11" fill="#475569">存储结构</text>
    <line x1="552" y1="693" x2="580" y2="693" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="588" y="697" font-size="11" fill="#475569">读取/回查</text>
  </g>
</svg>
